<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#334"/></marker></defs>
<style>
.t{font-size:12.5px;fill:#20262e;font-weight:600}.s{font-size:10.5px;fill:#4d5560}
.hdr{font-size:11px;fill:#0e7a6c;font-weight:700;letter-spacing:.08em}
.lbl{font-size:9.5px;fill:#4d5560;font-style:italic}
.w{stroke:#334;stroke-width:1.6;fill:none}
</style>
<text x="20" y="26" class="hdr">re8 — PIXEL PRIORITY LADDER &amp; VRAM BUS ARBITRATION</text>

<!-- priority ladder -->
<text x="20" y="58" class="t">Per-pixel priority — topmost opaque pixel wins</text>
<g>
<rect x="40" y="70" width="330" height="30" fill="#0e7a6c" stroke="#20262e" stroke-width="1.3" rx="4"/>
<text x="56" y="90" class="t" fill="#fff">1 · Hardware mouse cursor</text><text x="352" y="90" class="lbl" fill="#e3efec" text-anchor="end">absolute top</text>
<rect x="40" y="100" width="330" height="30" fill="#3f9c8f" stroke="#20262e" stroke-width="1.3" rx="4"/>
<text x="56" y="120" class="t" fill="#fff">2 · Text overlay layer</text><text x="352" y="120" class="lbl" fill="#eaf4f1" text-anchor="end">1bpp, transparent by default</text>
<rect x="40" y="130" width="330" height="26" fill="#e3efec" stroke="#20262e" stroke-width="1.2" rx="4"/><text x="56" y="148" class="s">3 · Sprite, priority 1</text>
<rect x="40" y="156" width="330" height="26" fill="#eef3f2" stroke="#20262e" stroke-width="1.2" rx="4"/><text x="56" y="174" class="s">4 · Plane A, priority 1</text>
<rect x="40" y="182" width="330" height="26" fill="#eef3f2" stroke="#20262e" stroke-width="1.2" rx="4"/><text x="56" y="200" class="s">5 · Plane B, priority 1</text>
<rect x="40" y="208" width="330" height="26" fill="#e3efec" stroke="#20262e" stroke-width="1.2" rx="4"/><text x="56" y="226" class="s">6 · Sprite, priority 0</text>
<rect x="40" y="234" width="330" height="26" fill="#eef3f2" stroke="#20262e" stroke-width="1.2" rx="4"/><text x="56" y="252" class="s">7 · Plane A, priority 0</text>
<rect x="40" y="260" width="330" height="26" fill="#eef3f2" stroke="#20262e" stroke-width="1.2" rx="4"/><text x="56" y="278" class="s">8 · Plane B, priority 0</text>
<rect x="40" y="286" width="330" height="26" fill="#f6f3ec" stroke="#20262e" stroke-width="1.2" rx="4"/><text x="56" y="304" class="s">9 · Backdrop — sub-palette 0, entry 0</text>
</g>
<text x="40" y="332" class="lbl">Colour index 0 is transparent in every sub-palette. Palette RAM is sampled per pixel,</text>
<text x="40" y="346" class="lbl">so mid-scanline palette writes take effect on the very next pixel.</text>
<text x="40" y="368" class="lbl">Per line: OAM is scanned 0→127 from the on-die shadow; the first 32 covering</text>
<text x="40" y="382" class="lbl">sprites are kept, the 33rd onward dropped (lower index wins and draws on top).</text>

<!-- arbitration -->
<text x="470" y="58" class="t">VRAM bus — one 8-bit bus at 21.477 MHz, fixed priority</text>
<rect x="490" y="72" width="300" height="46" fill="#0e7a6c" stroke="#20262e" stroke-width="1.3" rx="6"/>
<text x="506" y="92" class="t" fill="#fff">1 · Display fetch</text>
<text x="506" y="110" class="lbl" fill="#e3efec">always wins — the picture is never corrupted</text>

<rect x="490" y="126" width="300" height="46" fill="#3f9c8f" stroke="#20262e" stroke-width="1.3" rx="6"/>
<text x="506" y="146" class="t" fill="#fff">2 · Blitter</text>
<text x="506" y="164" class="lbl" fill="#eaf4f1">blanking-only, or interleaved into spare cycles</text>

<rect x="490" y="180" width="300" height="46" fill="#e3efec" stroke="#20262e" stroke-width="1.3" rx="6"/>
<text x="506" y="200" class="t">3 · CPU VRAM port / OAM DMA</text>
<text x="506" y="218" class="lbl">legal any time — RDY-stalled until a slot opens</text>

<path class="w" d="M640 118V126" marker-end="url(#a)"/>
<path class="w" d="M640 172V180" marker-end="url(#a)"/>

<text x="490" y="256" class="t">Per-frame budget — 357,630 accesses</text>
<g class="s">
<rect x="490" y="266" width="176" height="20" fill="#0e7a6c"/><text x="676" y="281">BG planes A+B ≈110 K</text>
<rect x="490" y="290" width="70" height="20" fill="#3f9c8f"/><text x="570" y="305">sprite patterns ≈29–57 K</text>
<rect x="490" y="314" width="58" height="20" fill="#7fbfb4"/><text x="558" y="329">text layer ≈36 K</text>
<rect x="490" y="338" width="4" height="20" fill="#d9d3c6"/><text x="504" y="353">sprite evaluation — 0 (on-die shadow OAM)</text>
<rect x="490" y="362" width="252" height="20" fill="#f6f3ec" stroke="#8b929c"/><text x="616" y="377" text-anchor="middle" class="lbl">free for blitter + CPU ≈157–182 K</text>
</g>
<text x="490" y="404" class="lbl">Display total ≈175–200 K (50–56 %). Margin is adequate, not large:</text>
<text x="490" y="418" class="lbl">a line of 32 full-width sprites plus both planes can approach saturation.</text>

<text x="490" y="448" class="t">Three sources stall the CPU via RDY</text>
<text x="490" y="468" class="s">VRAM port contention · OAM DMA (≈683 cycles) · PCM sample fetch (≈2.7–6 %)</text>
<text x="490" y="486" class="lbl">455 cycles/line is therefore an exact <tspan font-style="normal" font-weight="600">bus</tspan> budget, not a guaranteed instruction budget.</text>
</svg>
