<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 540" font-family="Inter, Helvetica, Arial, sans-serif">
<style>
.t{font-size:13px;fill:#20262e;font-weight:600}.s{font-size:10.5px;fill:#4d5560}
.a{font-size:10.5px;fill:#b9770e;font-family:'JetBrains Mono',monospace;font-weight:600}
.hdr{font-size:11px;fill:#0e7a6c;font-weight:700;letter-spacing:.08em}
.lbl{font-size:10px;fill:#4d5560;font-style:italic}
.ax{stroke:#20262e;stroke-width:1.3}.gl{stroke:#d9d3c6;stroke-width:1}
</style>
<text x="20" y="26" class="hdr">re8 — RASTER TIMING (60.055 Hz, 262 lines, 455 CPU cycles/line)</text>

<!-- FRAME -->
<text x="20" y="58" class="t">Frame — 262 lines × 1,365 master ticks = 357,630 ticks = 119,210 CPU cycles</text>
<rect x="60" y="70" width="620" height="150" fill="#fdfcf9" stroke="#20262e" stroke-width="1.4"/>
<rect x="60" y="70" width="620" height="128" fill="#e3efec"/>
<text x="370" y="140" class="t" text-anchor="middle">ACTIVE DISPLAY — lines 0–223</text>
<text x="370" y="160" class="s" text-anchor="middle">224 lines · sprite evaluation from shadow OAM · display fetch has bus priority 1</text>
<rect x="60" y="198" width="620" height="22" fill="#fdf3e0"/>
<text x="370" y="213" class="s" text-anchor="middle">VBLANK — lines 224–261 (38 lines ≈ 17,290 CPU cycles ≈ 2.4 ms)</text>
<text x="24" y="80" class="a">0</text><text x="18" y="196" class="a">223</text><text x="18" y="216" class="a">261</text>

<!-- events -->
<g class="s">
<circle cx="690" cy="200" r="4" fill="#0e7a6c"/><text x="702" y="204">line 224 — shadow-OAM snapshot · VBLANK IRQ</text>
<circle cx="690" cy="76" r="4" fill="#0e7a6c"/><text x="702" y="80">line 0 — pick coords latched · STATUS.3 cleared</text>
</g>
<text x="702" y="228" class="lbl">OAM DMA and bulk VRAM work belong here</text>

<!-- LINE -->
<text x="20" y="272" class="t">Line — 1,365 master ticks = 455 CPU cycles = 63.56 µs · HSYNC 15.734 kHz</text>

<!-- hi-res -->
<text x="20" y="300" class="s">320-mode · dot clock 6.703 MHz · 426 dots</text>
<rect x="60" y="308" width="440" height="34" fill="#e3efec" stroke="#20262e" stroke-width="1.3"/>
<rect x="500" y="308" width="19" height="34" fill="#f6f3ec" stroke="#20262e" stroke-width="1.3"/>
<rect x="519" y="308" width="44" height="34" fill="#d9d3c6" stroke="#20262e" stroke-width="1.3"/>
<rect x="563" y="308" width="82" height="34" fill="#f6f3ec" stroke="#20262e" stroke-width="1.3"/>
<text x="280" y="330" class="s" text-anchor="middle">320 active — 47.7 µs</text>
<text x="509" y="356" class="lbl" text-anchor="middle">14</text>
<text x="541" y="330" class="s" text-anchor="middle" fill="#20262e">sync 32</text>
<text x="604" y="330" class="s" text-anchor="middle">back porch 60</text>

<!-- lo-res -->
<text x="20" y="392" class="s">256-mode · dot clock 5.365 MHz · 341 dots</text>
<rect x="60" y="400" width="440" height="34" fill="#e3efec" stroke="#20262e" stroke-width="1.3"/>
<rect x="500" y="400" width="16" height="34" fill="#f6f3ec" stroke="#20262e" stroke-width="1.3"/>
<rect x="516" y="400" width="43" height="34" fill="#d9d3c6" stroke="#20262e" stroke-width="1.3"/>
<rect x="559" y="400" width="86" height="34" fill="#f6f3ec" stroke="#20262e" stroke-width="1.3"/>
<text x="280" y="422" class="s" text-anchor="middle">256 active — 47.7 µs</text>
<text x="508" y="448" class="lbl" text-anchor="middle">9</text>
<text x="537" y="422" class="s" text-anchor="middle" fill="#20262e">sync 25</text>
<text x="602" y="422" class="s" text-anchor="middle">back porch 51</text>

<line class="ax" x1="60" y1="462" x2="645" y2="462"/>
<line class="ax" x1="60" y1="457" x2="60" y2="467"/><line class="ax" x1="645" y1="457" x2="645" y2="467"/>
<text x="352" y="480" class="s" text-anchor="middle">63.56 µs — identical line and frame timing in both modes</text>

<text x="680" y="330" class="lbl">Both modes fill the same</text>
<text x="680" y="346" class="lbl">47.7 µs of active video, so</text>
<text x="680" y="362" class="lbl">neither is pillarboxed on</text>
<text x="680" y="378" class="lbl">analog outputs.</text>
<text x="680" y="406" class="lbl">DE marks the active window</text>
<text x="680" y="422" class="lbl">explicitly for the scaler.</text>

<text x="20" y="512" class="lbl">Vertical: 224 active + 3 front porch + 3 VSYNC + 32 back porch = 262. CSYNC = NOT(HSYNC XOR VSYNC), active-low, no equalisation or serration.</text>
<text x="20" y="530" class="lbl">Digital output is re-timed by the CH7035B to exactly 1080p60; analog outputs carry the native 60.055 Hz ±0.01 %.</text>
</svg>
