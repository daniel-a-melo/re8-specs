<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" font-family="Inter, Helvetica, Arial, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#334"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0e7a6c"/></marker>
</defs>
<style>
.b{fill:#fdfcf9;stroke:#20262e;stroke-width:1.6;rx:8}
.oito{fill:#e3efec;stroke:#0e7a6c;stroke-width:2.4;rx:10}
.acc{fill:#f6f3ec;stroke:#8b929c;stroke-width:1.3;stroke-dasharray:5 3;rx:8}
.t{font-size:13px;fill:#20262e;font-weight:600}
.s{font-size:10.5px;fill:#4d5560}
.v{font-size:9.5px;fill:#b9770e;font-weight:600}
.w{stroke:#334;stroke-width:1.6;fill:none}
.wv{stroke:#0e7a6c;stroke-width:2.6;fill:none}
.lbl{font-size:10px;fill:#4d5560;font-style:italic}
.hdr{font-size:11px;fill:#0e7a6c;font-weight:700;letter-spacing:.08em}
</style>
<text x="20" y="26" class="hdr">re8 — SYSTEM BLOCK DIAGRAM</text>

<!-- CPU -->
<rect class="b" x="30" y="60" width="150" height="72"/>
<text x="105" y="86" class="t" text-anchor="middle">W65C02S</text>
<text x="105" y="103" class="s" text-anchor="middle">7.159 MHz (master÷3)</text>
<text x="105" y="120" class="v" text-anchor="middle">3.3 V</text>

<!-- system SRAM / boot flash -->
<rect class="b" x="30" y="170" width="150" height="62"/>
<text x="105" y="193" class="t" text-anchor="middle">System SRAM</text>
<text x="105" y="210" class="s" text-anchor="middle">IS61C256AL · 16 KB decoded</text>
<text x="105" y="224" class="v" text-anchor="middle">3.3 V</text>

<rect class="b" x="30" y="252" width="150" height="62"/>
<text x="105" y="275" class="t" text-anchor="middle">Boot flash</text>
<text x="105" y="292" class="s" text-anchor="middle">SST39VF010 · 128 KB</text>
<text x="105" y="306" class="v" text-anchor="middle">3.3 V</text>

<!-- cartridge -->
<rect class="b" x="30" y="334" width="150" height="76"/>
<text x="105" y="357" class="t" text-anchor="middle">Cartridge</text>
<text x="105" y="374" class="s" text-anchor="middle">NOR 512 KB / 1 MB</text>
<text x="105" y="388" class="s" text-anchor="middle">+ FM18W08 FRAM (save)</text>
<text x="105" y="402" class="v" text-anchor="middle">3.3 V · 36-pin</text>

<!-- CPU BUS spine -->
<line class="w" x1="200" y1="96" x2="200" y2="372"/>
<text x="207" y="250" class="lbl" transform="rotate(-90 207 250)">CPU BUS · A0–15 · D0–7 · R/W̄ · PHI2</text>
<path class="w" d="M180 96H200" marker-end="url(#a)"/>
<path class="w" d="M180 201H200" marker-end="url(#a)"/>
<path class="w" d="M180 283H200" marker-end="url(#a)"/>
<path class="w" d="M180 372H200" marker-end="url(#a)"/>

<!-- oito -->
<rect class="oito" x="270" y="60" width="230" height="350"/>
<text x="385" y="88" class="t" text-anchor="middle" font-size="16">oito</text>
<text x="385" y="105" class="s" text-anchor="middle">SkyWater 130 nm · LQFP-144</text>
<text x="385" y="120" class="v" text-anchor="middle">1.8 V core / 3.3 V I/O</text>
<line x1="286" y1="132" x2="484" y2="132" stroke="#0e7a6c" stroke-width="1"/>
<text x="300" y="152" class="s">▸ VDP — 2 BG planes, 128 sprites</text>
<text x="300" y="170" class="s">▸ mini-blitter, collision, text layer</text>
<text x="300" y="188" class="s">▸ hardware cursor + hit-test</text>
<text x="300" y="206" class="s">▸ 16-voice APU (PSG/wave/PCM)</text>
<text x="300" y="224" class="s">▸ cartridge mapper + address decode</text>
<text x="300" y="242" class="s">▸ PS/2 host + joypad acquisition</text>
<text x="300" y="260" class="s">▸ PLL: CPU, dot, MCLK</text>
<text x="300" y="278" class="s">▸ 2 KB boot stub (mask ROM)</text>
<line x1="286" y1="292" x2="484" y2="292" stroke="#0e7a6c" stroke-width="1"/>
<text x="300" y="312" class="s">bus master during PCM fetch</text>
<text x="300" y="330" class="s">RDY / BE — wired-AND, open-drain</text>
<text x="300" y="356" class="lbl">XIN/XOUT 21.47727 MHz</text>
<text x="300" y="374" class="lbl">JTAG + DBḠ → expansion header</text>
<text x="300" y="394" class="lbl">116 signal pins</text>

<!-- VRAM private bus -->
<path class="wv" d="M500 150H575" marker-end="url(#ab)" marker-start="url(#ab)"/>
<text x="537" y="142" class="lbl" text-anchor="middle">private bus</text>
<rect class="b" x="575" y="118" width="150" height="64"/>
<text x="650" y="141" class="t" text-anchor="middle">VRAM</text>
<text x="650" y="158" class="s" text-anchor="middle">IS61C1024AL · 128 KB</text>
<text x="650" y="172" class="v" text-anchor="middle">3.3 V · 8-bit · 21.5 MHz</text>

<!-- video chain -->
<path class="w" d="M500 230H575" marker-end="url(#a)"/>
<text x="537" y="222" class="lbl" text-anchor="middle">12-bit RGB + syncs + DE</text>
<rect class="b" x="575" y="200" width="150" height="60"/>
<text x="650" y="222" class="t" text-anchor="middle">R-2R ladder</text>
<text x="650" y="238" class="s" text-anchor="middle">+ THS7374 buffers</text>
<text x="650" y="252" class="v" text-anchor="middle">5 V</text>

<rect class="b" x="575" y="276" width="150" height="60"/>
<text x="650" y="298" class="t" text-anchor="middle">CH7035B</text>
<text x="650" y="314" class="s" text-anchor="middle">scaler → DVI-D 1080p60</text>
<text x="650" y="328" class="v" text-anchor="middle">1.8 V + 3.3 V</text>
<path class="w" d="M500 300H575" marker-end="url(#a)"/>

<rect class="b" x="575" y="352" width="150" height="58"/>
<text x="650" y="374" class="t" text-anchor="middle">AD725</text>
<text x="650" y="390" class="s" text-anchor="middle">NTSC composite + Y/C</text>
<text x="650" y="403" class="v" text-anchor="middle">5 V</text>
<path class="w" d="M725 230 Q752 230 752 300 Q752 381 725 381" fill="none" stroke="#334" stroke-width="1.6" marker-end="url(#a)"/>

<!-- outputs -->
<rect class="acc" x="775" y="118" width="140" height="292"/>
<text x="845" y="140" class="t" text-anchor="middle">Outputs</text>
<text x="845" y="164" class="s" text-anchor="middle">HDMI-A (DVI-D)</text>
<text x="845" y="184" class="s" text-anchor="middle">SCART RGB</text>
<text x="845" y="204" class="s" text-anchor="middle">DE-15 15 kHz RGBHV</text>
<text x="845" y="224" class="s" text-anchor="middle">Composite (RCA)</text>
<text x="845" y="244" class="s" text-anchor="middle">S-Video</text>
<line x1="790" y1="262" x2="900" y2="262" stroke="#8b929c" stroke-width="1"/>
<text x="845" y="284" class="s" text-anchor="middle">TOSLINK S/PDIF</text>
<text x="845" y="304" class="s" text-anchor="middle">Line-out 3.5 mm</text>
<line x1="790" y1="322" x2="900" y2="322" stroke="#8b929c" stroke-width="1"/>
<text x="845" y="344" class="s" text-anchor="middle">2× DB9 controller</text>
<text x="845" y="364" class="s" text-anchor="middle">(PS/2 kbd/mouse</text>
<text x="845" y="380" class="s" text-anchor="middle">via passive adaptor)</text>
<path class="w" d="M725 148H775" marker-end="url(#a)"/>
<path class="w" d="M725 306H775" marker-end="url(#a)"/>

<!-- audio -->
<rect class="b" x="575" y="430" width="150" height="58"/>
<text x="650" y="452" class="t" text-anchor="middle">DIT4192 + NJM4556</text>
<text x="650" y="468" class="s" text-anchor="middle">S/PDIF + line driver</text>
<text x="650" y="481" class="v" text-anchor="middle">3.3 V / 5 V</text>
<path class="w" d="M420 410V459H575" marker-end="url(#a)"/>
<text x="470" y="452" class="lbl">I²S + MCLK · 2× PWM</text>
<path class="w" d="M725 459 Q760 459 760 300" fill="none" stroke="#334" stroke-width="1.6" marker-end="url(#a)"/>

<!-- controllers -->
<rect class="b" x="270" y="430" width="230" height="58"/>
<text x="385" y="452" class="t" text-anchor="middle">74LVC244A · AHCT125 · BSS138</text>
<text x="385" y="468" class="s" text-anchor="middle">port front-end (5 V ↔ 3.3 V)</text>
<text x="385" y="481" class="v" text-anchor="middle">5 V / 3.3 V</text>
<path class="w" d="M385 410V430" marker-end="url(#a)"/>
<path class="w" d="M500 459H545 Q560 459 560 400 V370 H775" fill="none" stroke="#334" stroke-width="1.6" marker-end="url(#a)"/>

<!-- probe -->
<rect class="acc" x="30" y="430" width="220" height="58"/>
<text x="140" y="452" class="t" text-anchor="middle">Expansion header (40-pin)</text>
<text x="140" y="468" class="s" text-anchor="middle">→ RP2350B debug probe</text>
<text x="140" y="481" class="s" text-anchor="middle">accessory, ≤300 mA @3.3 V</text>
<path class="w" d="M200 372V459H250" marker-end="url(#a)"/>

<!-- power -->
<rect class="b" x="30" y="520" width="885" height="66"/>
<text x="52" y="543" class="t">Power tree</text>
<text x="52" y="562" class="s">9 V DC in → buck 5 V → buck 3.3 V → LDO 1.8 V (+ ferrite-filtered 1.8 V analog for oito and CH7035B PLLs)</text>
<text x="52" y="578" class="s">Voltage supervisor holds CPU RES̄, oito RES̄ and CH7035B RESETB until all rails are stable; re-asserts on brownout.</text>
<text x="700" y="543" class="v">5 V · 3.3 V · 1.8 V</text>
<text x="700" y="562" class="s">~3–5 W, passively cooled</text>
</svg>
